<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 16 | Mukisa Divine Adriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --dark-gold: #B8860B;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-card {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .age-tag {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            font-size: 1.2rem;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* The Gift Mechanic */
        .box-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 60px auto;
            cursor: pointer;
        }

        .box-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #1a1a1a, #000);
            border: 2px solid var(--gold);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        /* Ribbon */
        .box-base::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: var(--gold);
        }

        .box-lid {
            position: absolute;
            top: 40px;
            left: -5px;
            width: 230px;
            height: 40px;
            background: var(--gold);
            border-radius: 4px;
            z-index: 5;
            transition: 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* The Surprise Text */
        .reveal-msg {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            opacity: 0;
            transition: 0.8s ease;
            z-index: 2;
        }

        .reveal-msg h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Open State */
        .box-wrapper.open .box-lid {
            transform: translateY(-160px) rotate(-15deg);
            opacity: 0;
        }

        .box-wrapper.open .reveal-msg {
            opacity: 1;
            transform: translate(-50%, -140px);
        }

        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--gold);
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>MUKISA DIVINE ADRIEL</h1>
        <div class="age-tag">Level 16 Unlocked</div>

        <div class="box-wrapper" id="giftBox" onclick="openSurprise()">
            <div class="reveal-msg">
                <h2>HAPPY 16TH BIRTHDAY!</h2>
                <p>Welcome to Chapter 16. <br> Time to make history.</p>
            </div>
            <div class="box-lid"></div>
            <div class="box-base"></div>
        </div>

        <p style="color: #444; font-size: 0.9rem;">Click the vault to reveal the surprise</p>
    </div>

    <script>
        function openSurprise() {
            const box = document.getElementById('giftBox');
            if (!box.classList.contains('open')) {
                box.classList.add('open');
                
                // Create particles
                for (let i = 0; i < 80; i++) {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.top = '-10px';
                    c.style.backgroundColor = Math.random() > 0.5 ? '#FFD700' : '#ffffff';
                    c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }
            }
        }
    </script>
</body>
</html>
